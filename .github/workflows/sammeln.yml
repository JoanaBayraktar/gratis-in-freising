name: Events sammeln

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:
    inputs:
      nachpruefen:
        description: "Zusaetzliche KI-Nachpruefung (optional)"
        type: boolean
        default: false
      social:
        description: "Social-Entwuerfe erzeugen (optional)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Daten und Archiv pruefen
        run: python scripts/datenpflege.py

      - name: Quellen abfragen
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/sammeln.py

      - name: Freigegebene Meldungen uebernehmen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/meldungen.py --spaeter-schliessen

      - name: Liste nachpruefen (optional)
        if: ${{ inputs.nachpruefen == true }}
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/nachpruefen.py

      - name: Daten normalisieren und Vergangenes archivieren
        run: |
          python scripts/datenpflege.py --schreiben
          python scripts/datenpflege.py

      - name: Kalender und Mail bauen
        run: |
          python scripts/build_kalender.py
          python scripts/build_mail.py

      - name: Social-Entwuerfe (optional)
        if: ${{ inputs.social == true }}
        run: python scripts/build_social.py

      # Erst speichern, dann senden: Ein SMTP-Fehler darf keine Daten verlieren.
      - name: Ergebnis festschreiben
        run: |
          git config user.name "gratis-freising-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten ausgabe
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Sammellauf $(date +%F)"
          for versuch in 1 2 3; do
            if git push; then exit 0; fi
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Konflikt beim Nachziehen. Bitte ansehen."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Ergebnis konnte nicht gespeichert werden."
          exit 1

      - name: Gespeicherte Meldungen abschliessen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/meldungen.py --abschliessen

      - name: Mail-Konfiguration pruefen
        id: mail
        env:
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_BENUTZER: ${{ secrets.MAIL_BENUTZER }}
          MAIL_PASSWORT: ${{ secrets.MAIL_PASSWORT }}
          MAIL_AN: ${{ secrets.MAIL_AN }}
        run: |
          if [ -n "$MAIL_SERVER" ] && [ -n "$MAIL_BENUTZER" ] && [ -n "$MAIL_PASSWORT" ] && [ -n "$MAIL_AN" ]; then
            echo "aktiv=true" >> "$GITHUB_OUTPUT"
          else
            echo "aktiv=false" >> "$GITHUB_OUTPUT"
            echo "Mailversand nicht eingerichtet; Kalender und Website funktionieren trotzdem."
          fi
          echo "betreff=$(cat ausgabe/mail-betreff)" >> "$GITHUB_OUTPUT"

      - name: Tagesmail senden
        if: ${{ steps.mail.outputs.aktiv == 'true' }}
        id: versand
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_BENUTZER }}
          password: ${{ secrets.MAIL_PASSWORT }}
          from: Gratis in Freising <${{ secrets.MAIL_BENUTZER }}>
          to: ${{ secrets.MAIL_AN }}
          subject: ${{ steps.mail.outputs.betreff }}
          html_body: file://ausgabe/mail.html

      - name: Versandfehler melden
        if: ${{ steps.versand.outcome == 'failure' }}
        run: |
          echo "::error::Daten gespeichert, aber Tagesmail nicht versendet."
          exit 1
