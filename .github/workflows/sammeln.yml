name: Events sammeln

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Daten und Archiv pruefen
        run: python scripts/datenpflege.py

      - name: Quellen abfragen
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/sammeln.py

      - name: Daten normalisieren und Vergangenes archivieren
        run: |
          python scripts/datenpflege.py --schreiben
          python scripts/datenpflege.py

      - name: Kalender bauen
        run: python scripts/build_kalender.py

      - name: Ergebnis festschreiben
        run: |
          git config user.name "gratis-freising-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten ausgabe
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Sammellauf $(date +%F)"
          for versuch in 1 2 3; do
            if git push; then exit 0; fi
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "::error::Konflikt beim Nachziehen. Bitte ansehen."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Ergebnis konnte nicht gespeichert werden."
          exit 1
