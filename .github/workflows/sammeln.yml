name: Events sammeln

on:
  # GitHub rechnet in UTC. 03:20 UTC sind 05:20 deutscher Sommerzeit
  # bzw. 04:20 im Winter. Der Start verschiebt sich bei GitHub regelmaessig
  # um 5 bis 20 Minuten — fuer einen naechtlichen Abgleich ohne Belang.
  schedule:
    - cron: "20 3 * * *"
  # Erlaubt den Lauf jederzeit von Hand: Actions-Tab, "Run workflow".
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sammeln
  cancel-in-progress: false

jobs:
  sammeln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Voller Verlauf: auf einer flachen Kopie schlaegt das Nachziehen
          # per rebase fehl, das der Push-Schritt unten braucht.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Quellen abfragen
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/sammeln.py

      # Zweiter Blick des Modells, diesmal auf die fertige Liste statt auf
      # einzelne Seiten: Dubletten ueber Quellen hinweg, widersprüchliche
      # Eintrittsangaben, uneinheitliche Ortsnamen. Schlaegt der Schritt fehl,
      # soll der Lauf trotzdem Kalender und Mail erzeugen — die Nachpruefung
      # verbessert das Ergebnis, sie traegt es nicht.
      - name: Liste nachpruefen
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: python scripts/nachpruefen.py

      - name: Kalender bauen
        run: python scripts/build_kalender.py

      # Freitags zusaetzlich die Social-Entwuerfe fuer die kommende Woche.
      - name: Social-Entwuerfe
        run: |
          if [ "$(date +%u)" = "5" ]; then
            python scripts/build_social.py
          else
            echo "Kein Freitag, uebersprungen."
          fi

      - name: Tagesmail bauen
        id: mail
        run: |
          python scripts/build_mail.py
          echo "betreff=$(cat ausgabe/mail-betreff)" >> "$GITHUB_OUTPUT"

      - name: Tagesmail senden
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_BENUTZER }}
          password: ${{ secrets.MAIL_PASSWORT }}
          from: Gratis in Freising <${{ secrets.MAIL_BENUTZER }}>
          to: ${{ secrets.MAIL_AN }}
          subject: ${{ steps.mail.outputs.betreff }}
          html_body: file://ausgabe/mail.html

      - name: Ergebnis festschreiben
        run: |
          git config user.name  "gratis-freising-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten ausgabe
          if git diff --staged --quiet; then
            echo "Nichts geaendert."
            exit 0
          fi
          git commit -m "Sammellauf $(date +%F)"

          # Der Lauf dauert Minuten. Wird in dieser Zeit etwas ins Repo
          # geschoben — eine Korrektur in events.json, eine geaenderte
          # quellen.yml —, weist GitHub den Push zurueck. Also neu aufsetzen
          # und noch einmal versuchen, statt den ganzen Lauf zu verlieren.
          for versuch in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push abgelehnt (Versuch $versuch). Hole den Stand nach."
            if ! git pull --rebase origin main; then
              # Konflikt in den Daten: hier faengt Automatik an zu raten.
              # Lieber laut scheitern — der naechste Lauf baut die Ausgabe
              # ohnehin neu, verloren geht nichts als dieser eine Commit.
              git rebase --abort || true
              echo "::error::Konflikt beim Nachziehen. Bitte einmal von Hand ansehen."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Push nach drei Versuchen nicht durchgekommen."
          exit 1
