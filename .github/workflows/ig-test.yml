name: Instagram-Probe (Wegwerf)
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Von einer Rechenzentrums-IP aus abrufen
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0 Safari/537.36")
          KOPF = {"User-Agent": UA, "X-IG-App-ID": "936619743392459",
                  "Accept": "*/*", "Referer": "https://www.instagram.com/"}
          url = ("https://www.instagram.com/api/v1/users/"
                 "web_profile_info/?username=lindenkeller_freising")
          try:
              a = urllib.request.Request(url, headers=KOPF)
              with urllib.request.urlopen(a, timeout=25) as r:
                  d = json.loads(r.read().decode("utf-8"))["data"]["user"]
                  n = len(d.get("edge_owner_to_timeline_media", {}).get("edges", []))
                  print(f"ERGEBNIS: OK — {n} Beitraege gelesen")
          except urllib.error.HTTPError as e:
              print(f"ERGEBNIS: HTTP {e.code}")
              print(e.read().decode("utf-8", "replace")[:300])
          except Exception as e:
              print(f"ERGEBNIS: {type(e).__name__}: {e}")
          PY
